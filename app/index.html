<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <!-- Edge niqobi (src/components/Decoy.jsx) — vkladka ilova ichida ham "Новая вкладка" bo'lib qoladi -->
    <link rel="icon" type="image/png" href="/decoy/img/tab-favicon@2x.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1012" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Новая вкладка</title>
    <script>
      try {
        const saved = localStorage.getItem('theme')
        const dark =
          saved === 'dark' ||
          ((!saved || saved === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark || !saved) document.documentElement.classList.add('dark')
        if (saved === 'light') document.documentElement.classList.remove('dark')
      } catch {
        document.documentElement.classList.add('dark')
      }
      try {
        for (const [key, cssVar] of [
          ['arabic-scale', '--arabic-scale'],
          ['uz-scale', '--uz-scale'],
        ]) {
          const saved = Number(localStorage.getItem(key))
          if (saved >= 0.8 && saved <= 1.8) {
            document.documentElement.style.setProperty(cssVar, String(saved))
          }
        }
      } catch {}
      /* Mavzu (Sozlamalar → Mavzu, src/lib/appearance.js) — birinchi chizishdanoq */
      try {
        const css = localStorage.getItem('appearance-css')
        if (css) {
          const style = document.createElement('style')
          style.id = 'appearance'
          style.textContent = css
          document.head.appendChild(style)
          document.documentElement.setAttribute('data-appearance', '')
        }
      } catch {}
    </script>
    <script type="module" crossorigin src="/assets/index-CVNNvQd_.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CCMEemE4.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
